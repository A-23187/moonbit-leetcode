name: update-moonpad-monaco
run-name: Update dependency @moonbit/moonpad-monaco by @${{ github.actor }}
on:
  schedule:
    # - cron: '* * * * *' # for test
    - cron: '10 0 * * *'
jobs:
  main:
    name: main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup git user
        run: |
          git config --global user.email a23187.1979421048@gmail.com
          git config --global user.name A23187
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Update @moonbit/moonpad-monaco
        run: bash scripts/update_moonpad_monaco.sh
